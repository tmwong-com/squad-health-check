name: "Run lint on Squad Health Check code"
description: "Run a lint check on the Squad Health Check code to ensure code quality and consistency"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  run-linter:
    name: "Run linter"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v6

      - name: "Run linter"
        run: |
          npm install
          make lint
